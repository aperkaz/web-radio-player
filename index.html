<!DOCTYPE HTML>
<html>
	<head>
		<title>Radio Jukebox</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,900&display=swap" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
		<script src="playback.js" defer></script>
	</head>
	<body class="loading">
		<div id="wrapper">
			<div id="bg"></div>
			<div id="overlay"></div>
			<div id="main">
				<!-- Header -->
					<header id="header">
						<h1>Radio Jukebox</h1>
						<p>
						<a id="paradise" data-station="0" style="cursor:pointer"> Paradise  </a>&nbsp;&bull;&nbsp;
						<a id="dance" data-station="1" style="cursor:pointer">  Dance   </a>&nbsp;&bull;&nbsp;
						<a id="folk" data-station="2" style="cursor:pointer">  Folk  </a>&nbsp;&bull;&nbsp;
						<a id="punk" data-station="3" style="cursor:pointer">  80s </a>
						</p>
						<nav>
							<ul>
								<li><a id="playbackButton" href="#"><svg id="playIcon" class="playback-icon" viewBox="0 0 448 512" fill="currentColor"><polygon points="73,39 73,473 393,256"/></svg><svg id="pauseIcon" class="playback-icon" viewBox="0 0 448 512" fill="currentColor" style="display:none"><rect x="64" y="39" width="100" height="434"/><rect x="284" y="39" width="100" height="434"/></svg><span class="label">Music</span></a></li>
							</ul>
						</nav>
						<div id="label">

						</div>
					</header>
			</div>
		</div>
		<script>
			window.onload = function() { document.body.className = ''; }
		</script>
	</body>
</html>
